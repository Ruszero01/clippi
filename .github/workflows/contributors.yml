name: Update contributors

on:
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
    paths:
      - .github/contributors.json
      - .github/contributors-font.json
      - .github/workflows/contributors.yml
      - scripts/update_contributors.py
      - assets/LOGO_notext.png
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contributors-wall
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Only execute trusted default-branch code, never the PR's head checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh contributor wall
        run: python3 scripts/update_contributors.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git add docs/images/contributors.svg docs/images/contributors-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh contributor wall'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
