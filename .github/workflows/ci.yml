name: Verify

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.0 fmt --check
      - name: Check lints
        run: cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo +1.94.0 test --locked
      - name: Verify long screenshots before release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-14'
        run: cargo +1.94.0 test --locked long_screenshot_png_and_tiff_decode_with_bounded_memory -- --ignored
