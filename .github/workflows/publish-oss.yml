name: Publish website installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    # Shared with release.yml so only one OSS publisher runs at a time.
    # `queue: max` keeps every manual backfill queued instead of letting a
    # third run cancel the pending one (the default is `queue: single`).
    concurrency:
      group: clippi-oss-publish
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: "oss-cn-shanghai.aliyuncs.com"
      OSS_BUCKET: "rains-ailurus-cn"
      OSS_PREFIX: "clippi/releases"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download release installers
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir artifacts \
            --pattern 'Clippi_*_x64-setup.exe' \
            --pattern 'Clippi_aarch64.dmg' \
            --pattern 'Clippi_x86_64.dmg'

      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG##*/}"
          VERSION="${VERSION#v}"
          bash scripts/extract_release_notes.sh "$VERSION" RELEASES.md > release-notes.md
          test -s release-notes.md

      - name: Publish installers and update manifest to Alibaba Cloud OSS
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet oss2
          python3 scripts/publish_oss.py \
            --artifacts artifacts \
            --tag "$TAG" \
            --notes-file release-notes.md
