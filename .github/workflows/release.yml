#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    needs: verify
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Setup macOS environment
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
      - name: Configure NSIS
        if: runner.os == 'Windows'
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.plan.outputs.tag }}"
          VERSION="${VERSION#v}"
          BIN="target/x86_64-pc-windows-msvc/dist/clippi.exe"
          STAGING="target/nsis-staging"
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/"
          cp "assets/LOGO_notext.ico" "$STAGING/app.ico"
          cp "LICENSE" "$STAGING/LICENSE.txt"
          # Convert to Windows-style path for makensis
          STAGING_WIN="$(cygpath -w "$PWD/$STAGING")"
          # //D prevents Git Bash from mangling /D into a drive-relative path
          "C:/Program Files (x86)/NSIS/makensis.exe" //INPUTCHARSET UTF8 //DVERSION="$VERSION" "//DSTAGING=$STAGING_WIN" installer.nsi
          # Copy output to distrib for upload
          mkdir -p target/distrib
          cp "$STAGING"/Clippi_*_x64-setup.exe target/distrib/
          sha256sum target/distrib/Clippi_*_x64-setup.exe > target/distrib/Clippi_"${VERSION}"_x64-setup.exe.sha256
          echo "Built NSIS installer: target/distrib/Clippi_${VERSION}_x64-setup.exe"
      - name: Build macOS .dmg
        if: runner.os == 'macOS'
        run: |
          # Extract architecture label from target triple (e.g. aarch64-apple-darwin → aarch64)
          TARGET="${{ matrix.targets[0] }}"
          ARCH="${TARGET%%-*}"
          VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "clippi") | .version')"
          BIN_PATH="target/${TARGET}/dist/clippi"
          APP_DIR="target/Clippi.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/clippi"
          cp "assets/LOGO.icns" "$APP_DIR/Contents/Resources/clippi.icns"
          cat > "$APP_DIR/Contents/Info.plist" << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>English</string>
              <key>CFBundleDisplayName</key>
              <string>Clippi</string>
              <key>CFBundleExecutable</key>
              <string>clippi</string>
              <key>CFBundleIconFile</key>
              <string>clippi</string>
              <key>CFBundleIdentifier</key>
              <string>com.clippi.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Clippi</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSDesktopFolderUsageDescription</key>
              <string>Clippi reads and writes only the desktop folder you choose for database storage or local-folder sync.</string>
              <key>NSDocumentsFolderUsageDescription</key>
              <string>Clippi reads and writes only the documents folder you choose for database storage or local-folder sync.</string>
              <key>NSDownloadsFolderUsageDescription</key>
              <string>Clippi reads and writes only the downloads folder you choose for database storage or local-folder sync.</string>
              <key>NSNetworkVolumesUsageDescription</key>
              <string>Clippi reads and writes only the network folder you choose for local-folder sync.</string>
              <key>NSRemovableVolumesUsageDescription</key>
              <string>Clippi reads and writes only the removable drive folder you choose for database storage or local-folder sync.</string>
          </dict>
          </plist>
          PLISTEOF
          # Ad-hoc sign the .app bundle so Gatekeeper can validate it
          # Without this, the linker's ad-hoc signature expects sealed resources
          # but the manual assembly leaves them unsealed, causing "damaged" error
          # that even right-click → Open cannot bypass
          # Keep a stable designated requirement across ad-hoc builds so macOS
          # can associate Accessibility approval with the Clippi bundle identity
          # instead of a per-build cdhash.
          codesign --deep --force --sign - \
            --requirements '=designated => identifier "com.clippi.app"' \
            "$APP_DIR"
          plutil -lint "$APP_DIR/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP_DIR/Contents/Info.plist")" = "com.clippi.app"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_DIR/Contents/Info.plist")" = "$VERSION"
          plutil -extract NSDocumentsFolderUsageDescription raw "$APP_DIR/Contents/Info.plist" >/dev/null
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP_DIR" 2>/dev/null || true)"
          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "Unexpected App Sandbox entitlement; selected paths would need security-scoped bookmarks." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -v -R='identifier "com.clippi.app"' "$APP_DIR"
          # Create staging directory with .app + Applications symlink
          STAGING="target/dmg-staging"
          DMG_PATH="target/distrib/Clippi_${ARCH}.dmg"
          mkdir -p target/distrib
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_DIR" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Clippi" -srcfolder "$STAGING" -ov -format UDZO -fs HFS+ "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"
          echo "Built macOS .dmg: $DMG_PATH"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          # Include NSIS installer and DMG in upload paths
          if [ -f target/distrib/Clippi_*_x64-setup.exe ]; then
            ls target/distrib/Clippi_*_x64-setup.exe target/distrib/Clippi_*_x64-setup.exe.sha256 >> "$GITHUB_OUTPUT" 2>/dev/null || true
          fi
          # Include macOS DMGs in upload paths
          ls target/distrib/Clippi_*.dmg target/distrib/Clippi_*.dmg.sha256 >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/*.dmg
            target/distrib/*.dmg.sha256
            target/distrib/*_x64-setup.exe
            target/distrib/*_x64-setup.exe.sha256

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        shell: bash
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          VERSION="${TAG#v}"
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"

          LC_ALL=C sed $'1s/^\xEF\xBB\xBF//' RELEASES.md | awk -v version="$VERSION" '
            BEGIN {
              in_section = 0
              found = 0
            }
            /^# +Version[[:space:]]+/ {
              if (in_section) exit
              pattern = "^# +Version[[:space:]]+v?" version "([[:space:]]|$)"
              if ($0 ~ pattern) {
                in_section = 1
                found = 1
                next
              }
            }
            /^---[[:space:]]*$/ {
              if (in_section) exit
            }
            in_section {
              print
            }
            END {
              if (!found) exit 1
            }
          ' | sed '/./,$!d' > "$RELEASE_NOTES"

          if [ ! -s "$RELEASE_NOTES" ]; then
            echo "No release notes found for Version $VERSION in RELEASES.md" >&2
            exit 1
          fi

          # Write and read notes from a file to avoid quoting breaking things.
          {
            printf '## Release Notes\n\n'
            cat "$RELEASE_NOTES"
            printf '\n'
            printf '%s\n' "$ANNOUNCEMENT_BODY"
          } > "$RUNNER_TEMP/notes.txt"

          # Retrying a release must never delete or move an existing tag.
          # cargo-dist may already have created the release; update it in place.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
          else
            gh release create "$TAG" --verify-tag $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          fi
      - name: Add DMG and NSIS to release notes
        env:
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          VERSION="${TAG#v}"
          # Generate DMG rows for any macOS architectures found in artifacts
          DMG_ROWS=""
          for dmg in artifacts/Clippi_*.dmg; do
            [ -f "$dmg" ] || continue
            DMG_FILE="$(basename "$dmg")"
            DMG_URL="https://github.com/Ruszero01/clippi/releases/download/${TAG}/${DMG_FILE}"
            DMG_CHECK_URL="https://github.com/Ruszero01/clippi/releases/download/${TAG}/${DMG_FILE}.sha256"
            # Derive human-readable arch label from filename
            case "$DMG_FILE" in
              Clippi_aarch64.dmg)
                LABEL="Apple Silicon macOS (DMG)" ;;
              Clippi_x86_64.dmg)
                LABEL="Intel macOS (DMG)" ;;
              *)
                LABEL="macOS (DMG)" ;;
            esac
            DMG_ROWS="${DMG_ROWS}| [${DMG_FILE}](${DMG_URL}) | ${LABEL} | [checksum](${DMG_CHECK_URL}) |"$'\n'
          done

          NSIS_FILE="Clippi_${VERSION}_x64-setup.exe"
          NSIS_URL="https://github.com/Ruszero01/clippi/releases/download/${TAG}/${NSIS_FILE}"
          NSIS_CHECK_URL="https://github.com/Ruszero01/clippi/releases/download/${TAG}/${NSIS_FILE}.sha256"
          NSIS_ROW="| [${NSIS_FILE}](${NSIS_URL}) | x64 Windows (NSIS) | [checksum](${NSIS_CHECK_URL}) |"

          BODY=$(gh release view "$TAG" --json body -q '.body')
          printf '%s\n%s%s\n' "$BODY" "$DMG_ROWS" "$NSIS_ROW" > "$RUNNER_TEMP/notes.txt"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.txt"

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
