[package]
name = "clippi"
version = "0.3.9"
description = "A lightweight clipboard manager"
authors = ["Rains"]
repository = "https://github.com/Ruszero01/clippi"
license = "MIT"
edition = "2021"
build = "build.rs"

[package.metadata.bundle]
name = "Clippi"
identifier = "com.clippi.app"
icon = ["assets/LOGO.icns"]
version = "0.3.9"
copyright= "Copyright © 2026 Rains. MIT license."
category = "Utility"
short_description = "A lightweight clipboard manager"
long_description = "Clippi is a lightweight clipboard manager that helps you manage your clipboard history with ease."
osx_minimum_system_version = "12.0"

[dependencies]
gpui = { version = "0.2.2", default-features = false }
gpui-component = "0.5"
gpui_transitions = "0.1.5"
clipboard-rs = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
chrono = "0.4"
tray-icon = "0.19"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
global-hotkey = "0.6"
dirs = "6"
base64 = "0.22"
percent-encoding = "2"
rqrr = "0.7"
ureq = "2"
pinyin = "0.11"
semver = "1"
sha2 = "0.10"
log = "0.4"
simplelog = "0.12"
libc = "0.2"
hostname = "0.4"
raw-window-handle = "0.6"
rodio = "0.20"
uuid = { version = "1", features = ["v4", "v5"] }
oxipng = { version = "10", default-features = false, features = ["parallel"] }
mozjpeg-rs = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", features = ["windows-manifest"] }
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility"] }
windows-core = "0.58"
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["font-kit"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSBundle", "NSDictionary", "NSArray", "NSThread", "NSLocale"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSScreen", "NSAppearance", "NSWorkspace", "NSWindow", "NSView", "NSEvent", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
