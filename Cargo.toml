[package]
name = "clippi"
version = "0.1.0-alpha.2"
description = "A lightweight clipboard manager"
authors = ["Rains"]
repository = "https://github.com/Ruszero01/clippi"
license = "MIT"
edition = "2021"
build = "build.rs"

[package.metadata.wix]
upgrade-guid = "66941EB2-9E76-47FE-93C4-E29C1CE863C8"
path-guid = "DFAC08E5-F4EF-4907-9424-79708970616D"
license = false
eula = false

[package.metadata.bundle]
name = "Clippi"
identifier = "com.clippi.app"
icon = ["assets/LOGO.icns"]
version = "0.1.0"
copyright= "Copyright © 2025 Rains. MIT license."
category = "Utility"
short_description = "A lightweight clipboard manager"
long_description = "Clippi is a lightweight clipboard manager that helps you manage your clipboard history with ease."
osx_minimum_system_version = "12.0"

[dependencies]
slint = { version = "1.16", features = ["unstable-fontique-08"] }
clipboard-rs = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
chrono = "0.4"
tray-icon = "0.19"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
global-hotkey = "0.6"
dirs = "6"
base64 = "0.22"
ureq = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSDictionary", "NSArray", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSScreen", "NSAppearance", "NSWorkspace", "NSWindow", "NSEvent"] }
core-graphics = "0.25"
i-slint-backend-winit = { version = "1.16", features = ["renderer-femtovg", "accessibility"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[build-dependencies]
slint-build = "1.16"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
